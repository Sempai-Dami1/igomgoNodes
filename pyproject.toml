[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "igomgonodes"
version = "0.1.0"
description = "Base framework for draggable node graphs (ports, rules, bounded feedback) in Streamlit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.65",
    "streamlit-flow-component>=1.6",
]
examples = [
    "igomgonodes[ui]",
    "numpy>=2.0",
    "scipy>=1.14",
    "pillow>=11.0",
    "qrcode>=8.0",
    "plotly>=5.24",
    "soundfile>=0.12",
]
dev = [
    "igomgonodes[examples]",
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[project.urls]
Repository = "https://github.com/Sempai-Dami1/igomgoNodes"

[tool.hatch.build.targets.wheel]
packages = ["src/igomgo_nodes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "examples", "app.py"]
pythonVersion = "3.11"
